name: Deploy Ptrainer to GitHub Pages

on:
  push:
    branches: [github-pages-test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one concurrent deployment; let a newer commit supersede an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # PGlite's WebAssembly build is copied out of node_modules by the build
      # script, so the dependencies must be installed even though nothing runs.
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: node scripts/build-pages.mjs
      # enablement turns Pages on for the repository if it is not configured
      # yet, so no manual Settings change is needed before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
