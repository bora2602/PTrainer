name: ptrainer

services:
  edge:
    image: caddy:2.10-alpine
    profiles: ["edge"]
    environment:
      PTRAINER_DOMAIN: ${PTRAINER_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./app/Caddyfile:/etc/caddy/Caddyfile:ro
      - ptrainer_caddy_data:/data
      - ptrainer_caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ./app
    init: true
    environment:
      DATABASE_URL: postgresql://ptrainer:${PTRAINER_DB_PASSWORD:-ptrainer_local_dev}@postgres:5432/ptrainer
      HOST: 0.0.0.0
      PORT: 4173
      # Left empty on purpose: the entrypoint asks the tunnel for the address
      # Cloudflare assigned. Set APP_ORIGIN in .env to pin a fixed hostname.
      APP_ORIGIN: ${APP_ORIGIN:-}
      # Set to 0 to skip the tunnel wait and come up local-only right away.
      TUNNEL_WAIT_MS: ${TUNNEL_WAIT_MS:-}
      NODE_ENV: ${NODE_ENV:-development}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PRIVACY_ORGANIZATION: ${PRIVACY_ORGANIZATION:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      DATA_STORAGE_REGION: ${DATA_STORAGE_REGION:-}
      # Safe by default because the app port is published only to localhost;
      # turn it off if you ever expose that port beyond this machine.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RETENTION_INTERVAL_HOURS: ${RETENTION_INTERVAL_HOURS:-}
      TOKEN_RETENTION_DAYS: ${TOKEN_RETENTION_DAYS:-}
      SESSION_RETENTION_HOURS: ${SESSION_RETENTION_HOURS:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      EMAIL_HTTP_URL: ${EMAIL_HTTP_URL:-}
      EMAIL_HTTP_TOKEN: ${EMAIL_HTTP_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      FOOD_API_USER_AGENT: ${FOOD_API_USER_AGENT:-Ptrainer/0.1 (https://github.com/bora2602/PTrainer)}
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      postgres:
        condition: service_healthy
      tunnel:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  # Publishes the app over the internet without opening a router port: cloudflared
  # dials out to Cloudflare and reaches the app over this compose network, so the
  # app port stays bound to localhost. Unpinned on purpose - Cloudflare retires
  # old client versions from its edge.
  #
  # With no TUNNEL_TOKEN this is an account-free quick tunnel and Cloudflare picks
  # a new random hostname on every start. For a fixed address, create a named
  # tunnel, then set TUNNEL_TOKEN and TUNNEL_RUN_ARGS=run in .env.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 ${TUNNEL_RUN_ARGS:---url http://app:4173}
    environment:
      # Only handed over in named-tunnel mode. cloudflared reads this variable
      # whatever the command asks for, so a token left behind from an earlier
      # setup would be applied to the quick tunnel it falls back to. Pairing it
      # with TUNNEL_RUN_ARGS keeps the two modes from mixing credentials.
      TUNNEL_TOKEN: ${TUNNEL_RUN_ARGS:+${TUNNEL_TOKEN:-}}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ptrainer
      POSTGRES_USER: ptrainer
      POSTGRES_PASSWORD: ${PTRAINER_DB_PASSWORD:-ptrainer_local_dev}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ptrainer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptrainer -d ptrainer"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  ptrainer_postgres_data:
  ptrainer_caddy_data:
  ptrainer_caddy_config:
