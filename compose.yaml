name: ptrainer

services:
  edge:
    image: caddy:2.10-alpine
    profiles: ["edge"]
    environment:
      PTRAINER_DOMAIN: ${PTRAINER_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./app/Caddyfile:/etc/caddy/Caddyfile:ro
      - ptrainer_caddy_data:/data
      - ptrainer_caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ./app
    init: true
    environment:
      DATABASE_URL: postgresql://ptrainer:${PTRAINER_DB_PASSWORD:-ptrainer_local_dev}@postgres:5432/ptrainer
      HOST: 0.0.0.0
      PORT: 4173
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:4173}
      NODE_ENV: ${NODE_ENV:-development}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PRIVACY_ORGANIZATION: ${PRIVACY_ORGANIZATION:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      DATA_STORAGE_REGION: ${DATA_STORAGE_REGION:-}
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ptrainer
      POSTGRES_USER: ptrainer
      POSTGRES_PASSWORD: ${PTRAINER_DB_PASSWORD:-ptrainer_local_dev}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ptrainer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptrainer -d ptrainer"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  ptrainer_postgres_data:
  ptrainer_caddy_data:
  ptrainer_caddy_config:
